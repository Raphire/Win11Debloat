name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pester:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run tests
        shell: powershell
        run: ./Scripts/Run-Tests.ps1 -Bootstrap

  psscriptanalyzer:
    name: PSScriptAnalyzer (Error severity)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Run PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -Confirm:$false
          Import-Module PSScriptAnalyzer
          Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error -EnableExit
